<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo de Adivinhação</h1>
        <p>Tente adivinhar o número secreto entre **1 e 100**.</p>
       
        <div class="game-box">
            <input type="number" id="palpite" min="1" max="100" placeholder="Digite o seu palpite">
            <button id="btn-chutar">Chutar</button>
        </div>

        <p id="mensagem" class="mensagem"></p>
        <p>Tentativas restantes: <span id="num-tentativas">10</span></p>
       
        <button id="btn-reiniciar" class="hidden">Jogar Novamente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
